name: Build macOS DMG

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    # macos-15-intel is the last Intel runner GitHub offers (until Aug 2027),
    # so the .app is x86_64: native on Intel Macs (incl. macOS 12) and runs on
    # Apple Silicon via Rosetta 2.
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build .app and .dmg
        run: ./scripts/build_macos.sh

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: tracker-dmg
          path: dist/tracker-*-macos.dmg

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/tracker-*-macos.dmg
