name: Build Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tkinter availability
        run: python -c "import tkinter; print('tkinter OK', tkinter.TkVersion)"

      - name: Build and zip
        run: powershell -ExecutionPolicy Bypass -File scripts/build_windows.ps1

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: tracker-windows-x86_64
          path: dist/tracker-*-windows-x86_64.zip

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/tracker-*-windows-x86_64.zip
