name: Build Linux (.deb + AppImage)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            debarch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            debarch: arm64
            runner: ubuntu-24.04-arm   # free on public repos
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build .deb and AppImage
        run: ./scripts/build_linux.sh

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: tracker-deb-${{ matrix.debarch }}
          path: dist/tracker_*.deb

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: tracker-appimage-${{ matrix.debarch }}
          path: dist/tracker-*.AppImage

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tracker_*.deb
            dist/tracker-*.AppImage
