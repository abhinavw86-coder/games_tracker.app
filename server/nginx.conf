server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/tracker;

    # The JSON feed the Mac app polls.
    location = /tournaments.json {
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri =404;
    }
}
